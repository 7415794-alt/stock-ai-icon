<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>스톡시그널 - 주식 AI 확률 분석</title>
  <meta name="description" content="종목을 검색하면 AI가 상승·하락 확률을 분석해 드립니다.">
  <meta name="theme-color" content="#030830">
  <meta name="google-adsense-account" content="ca-pub-4318202692681153">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <style>
    :root { --footer: 44px; --ad: 60px; }
    html, body { margin: 0; height: 100%; background: #ffffff; overflow: hidden; }
    body { display: flex; flex-direction: column; }
    /* 맨 위 가로 배너 광고 (가로로 길고 세로로 짧게) */
    #ad { flex: 0 0 var(--ad); height: var(--ad); overflow: hidden; background: #f5f6f8;
          border-bottom: 1px solid #e6e8ec; padding-top: env(safe-area-inset-top); }
    #ad[hidden] { display: none; }
    #app { flex: 1; min-height: 0; overflow: hidden; }
    /* iframe을 아래로 길게 늘려서, 맨 아래 'Built with Streamlit · Fullscreen' 줄을 화면 밖으로 잘라냄 */
    iframe { border: 0; width: 100%; height: calc(100% + var(--footer)); display: block; }
    /* 우측 하단 버전 표기 */
    #ver { position: fixed; right: 8px; bottom: calc(6px + env(safe-area-inset-bottom)); z-index: 10;
           font: 11px/1.4 -apple-system, "Segoe UI", "Malgun Gothic", sans-serif; color: #8a90a0;
           background: rgba(255,255,255,.85); padding: 1px 6px; border-radius: 6px; pointer-events: none; }
    /* 다시 불러오는 중 안내 */
    #retry { position: fixed; left: 50%; top: 12px; transform: translateX(-50%); z-index: 10;
             font: 13px/1.4 -apple-system, "Segoe UI", "Malgun Gothic", sans-serif; color: #fff;
             background: rgba(3,8,48,.88); padding: 6px 12px; border-radius: 999px; white-space: nowrap; }
    #retry[hidden] { display: none; }
  </style>
</head>
<body>
  <!-- 구글 애드센스: 승인 후 아래 두 값만 채우면 광고가 나옵니다. 비어 있으면 광고 칸이 숨겨집니다. -->
  <div id="ad" hidden>
    <ins class="adsbygoogle" style="display:block;width:100%;height:60px"></ins>
  </div>
  <div id="app">
    <!-- Streamlit Cloud 앱 주소. 바뀌면 여기만 고치세요. -->
    <iframe id="frame" title="스톡시그널" allow="clipboard-write; web-share"></iframe>
  </div>
  <div id="ver">(1.0.0v)</div>
  <div id="retry" hidden>연결이 느려서 다시 불러오는 중…</div>
  <script>
    const AD_CLIENT = "ca-pub-4318202692681153";
    const AD_SLOT = "";    // 애드센스 승인 후 만든 광고 단위 번호 (예: "1234567890")
    if (AD_CLIENT && AD_SLOT) {
      const ins = document.querySelector(".adsbygoogle");
      ins.dataset.adClient = AD_CLIENT;
      ins.dataset.adSlot = AD_SLOT;
      document.getElementById("ad").hidden = false;
      const s = document.createElement("script");
      s.async = true;
      s.crossOrigin = "anonymous";
      s.src = "https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=" + AD_CLIENT;
      document.head.appendChild(s);
      (window.adsbygoogle = window.adsbygoogle || []).push({});
    }

    // 앱이 다 뜨면 app.py가 'stock-ai-ready' 신호를 보냄. 정해진 시간 안에 신호가 없으면 멈춘 것으로 보고 다시 불러옴
    const APP_URL = "https://stock-ai-7415794.streamlit.app/?embed=true";
    const frame = document.getElementById("frame"), retry = document.getElementById("retry");
    let tries = 0, ready = false, timer;

    // 앱 주소 만들기: 공유 링크 종목(s, h) + 이 휴대폰에 저장된 관심 종목·최근 본 종목을 붙여서 보냄
    function appUrl() {
      const u = new URL(APP_URL), q = new URLSearchParams(location.search);
      for (const k of ["s", "h"]) if (q.get(k)) u.searchParams.set(k, q.get(k));
      try {
        for (const k of ["fav", "recent", "hold"]) {
          const v = localStorage.getItem("stock-ai-" + k);
          if (v) u.searchParams.set(k, v);
        }
      } catch (e) {}
      return u.toString();
    }
    frame.src = appUrl();

    function toast(text) {
      retry.textContent = text; retry.hidden = false;
      setTimeout(() => { retry.hidden = true; retry.textContent = "연결이 느려서 다시 불러오는 중…"; }, 2500);
    }
    // 앱에서 '공유하기'를 누르면: 휴대폰 공유 창 → 안 되면 링크 복사
    async function share(d) {
      try { if (navigator.share) { await navigator.share({ title: d.title, text: d.text, url: d.url }); return; } }
      catch (e) { if (e.name === "AbortError") return; }
      try { await navigator.clipboard.writeText(d.text + " " + d.url); toast("링크를 복사했어요. 원하는 곳에 붙여 넣어 보내세요"); }
      catch (e) { prompt("이 링크를 복사해서 보내 주세요", d.url); }
    }
    function watch() {
      clearTimeout(timer);
      timer = setTimeout(() => {
        if (ready || tries >= 6) return;
        tries++;
        retry.hidden = false;
        frame.src = appUrl() + "&r=" + Date.now();  // 새 주소로 불러서 멈춘 연결을 버림
        watch();
      }, (25 + tries * 10) * 1000);  // 25초, 35초, 45초 … 점점 길게 기다림
    }
    addEventListener("message", (e) => {
      let host = "";
      try { host = new URL(e.origin).hostname; } catch (err) {}
      if (!/\.streamlit\.app$/.test(host)) return;  // 우리 앱이 보낸 신호만 받음
      const d = e.data;
      if (d === "stock-ai-ready") {
        ready = true; clearTimeout(timer); retry.hidden = true;
      } else if (d && d.type === "stock-ai-store") {  // 관심 종목·최근 본 종목을 이 휴대폰에 저장
        try {
          localStorage.setItem("stock-ai-fav", d.fav || "");
          localStorage.setItem("stock-ai-recent", d.recent || "");
          if (typeof d.hold === "string") localStorage.setItem("stock-ai-hold", d.hold);  // 내 보유 종목
        } catch (err) {}
      } else if (d && d.type === "stock-ai-share") {
        if (e.source) e.source.postMessage("stock-ai-share-ok", "*");
        share(d);
      }
    });
    watch();

    if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");
  </script>
</body>
</html>
